services:
  - type: web
    name: gospel-conversation-simulator
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEV_LOGIN
        value: "false"
      - key: STORAGE_DIR
        value: /var/data
      - key: OPENAI_CHAT_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_CHAT_REASONING_EFFORT
        value: high
      - key: OPENAI_FEEDBACK_MODEL
        value: gpt-5.4
      - key: APP_BASE_URL
        value: https://gospel-conversation-simulator.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: USD_TO_KRW
        value: "1480"
      - key: EXCHANGE_RATE_API_URL
        value: https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW
      - key: EXCHANGE_RATE_REFRESH_MS
        value: "21600000"
      - key: EXCHANGE_RATE_TIMEOUT_MS
        value: "4000"
      - key: SUPABASE_URL
        value: https://wyqpcldqlyrqbppjdhhp.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
      - key: LANGFUSE_PROMPT_LABEL
        value: production
      - key: LANGFUSE_PROMPT_REFRESH_MS
        value: "60000"
